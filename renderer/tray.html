<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LoliBox</title>
    <link rel="stylesheet" href="./styles/tray.css" />
  </head>
  <body>
    <div class="tray-card" id="card">
      <div class="tray-glow" aria-hidden="true"></div>

      <div class="tray-head">
        <div class="tray-brand">
          <span class="tray-brand-dot" aria-hidden="true"></span>
          LoliBox
        </div>
        <button class="tray-icon-btn" id="hide" title="Скрыть" aria-label="Скрыть">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>

      <div class="tray-track">
        <div class="tray-art">
          <img id="artImg" alt="" hidden />
          <div class="tray-art-placeholder" id="artPlaceholder">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 18V5l12-2v13" />
              <circle cx="6" cy="18" r="3" />
              <circle cx="18" cy="16" r="3" />
            </svg>
          </div>
        </div>
        <div class="tray-meta">
          <div class="tray-title" id="title">Ничего не играет</div>
          <div class="tray-artist" id="artist">Включите трек в LoliBox</div>
        </div>
        <button class="tray-fav" id="fav" title="Добавить в избранное" aria-label="Избранное" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />
          </svg>
        </button>
      </div>

      <div class="tray-progress-row">
        <span class="tray-time" id="time">0:00</span>
        <div class="tray-progress" id="progress" title="Перемотка">
          <div class="tray-progress-fill" id="progressFill"></div>
        </div>
        <span class="tray-time" id="duration">0:00</span>
      </div>

      <div class="tray-controls">
        <button class="tray-ctrl" id="prev" title="Предыдущий" aria-label="Предыдущий" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" />
          </svg>
        </button>
        <button class="tray-play" id="play" title="Воспроизвести" aria-label="Воспроизвести" disabled>
          <svg class="tray-icon-play" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M8 5v14l11-7z" />
          </svg>
          <svg class="tray-icon-pause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" hidden>
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
          </svg>
        </button>
        <button class="tray-ctrl" id="next" title="Следующий" aria-label="Следующий" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M6 18l8.5-6L6 6v12zM16 6h2v12h-2z" />
          </svg>
        </button>
      </div>

      <div class="tray-volume-row">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
        </svg>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="0" aria-label="Громкость" />
      </div>

      <div class="tray-footer">
        <button class="tray-open" id="open">Открыть LoliBox</button>
        <button class="tray-quit" id="quit">Выход</button>
      </div>
    </div>

    <script type="module" src="./tray.js"></script>
  </body>
</html>
